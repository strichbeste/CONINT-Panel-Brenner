name: pipeline

on:
  push:
    branches: [main, deploy/production]

permissions:
  contents: read

jobs:
  lint:
    name: 1a Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - name: ESLint report
        if: always()
        run: npx eslint src tests scripts -f json -o eslint-report.json || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: eslint-report, path: eslint-report.json }

  test:
    name: 2 Unit tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: coverage, path: coverage }

  sonar:
    name: 1b SonarQube Cloud
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: coverage, path: coverage }
      - uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT }}
            -Dsonar.qualitygate.wait=true

  snyk:
    name: 1c Snyk
    needs: [lint, test]
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Snyk test (fails on high/critical)
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        with:
          args: --severity-threshold=high
      - name: Snyk monitor (dashboard)
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        with:
          command: monitor

  build:
    name: 3 Build (Docker)
    needs: [sonar, snyk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t campus-events-api .

  deliver:
    name: 4 Deliver (Docker Hub)
    if: github.ref == 'refs/heads/deploy/production'
    needs: [build]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build, tag and push
        run: |
          IMAGE="$DOCKERHUB_USERNAME/campus-events-api"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
